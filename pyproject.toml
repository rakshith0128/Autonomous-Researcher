[project]
name = "autonomous-research-agent"
version = "0.1.0"
description = "A fully autonomous multi-agent system that discovers emerging scientific domains and writes its own research papers."
requires-python = ">=3.11"

dependencies = [
    # --- web layer ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "python-multipart>=0.0.12",

    # --- contracts & config ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # --- orchestration ---
    "langgraph>=0.2.45",
    "langchain-core>=0.3.15",

    # --- LLM access ---
    # Every provider we use (Groq, Gemini, Cerebras, OpenRouter) exposes an
    # OpenAI-compatible endpoint, so one SDK covers all of them. See llm/router.py.
    "openai>=1.54.0",
    "tenacity>=9.0.0",

    # --- persistence & memory ---
    "aiosqlite>=0.20.0",
    "chromadb>=0.5.20",
    "fastembed>=0.4.2",

    # --- data acquisition ---
    "httpx>=0.27.2",
    "beautifulsoup4>=4.12.3",
    "trafilatura>=1.12.2",
    "feedparser>=6.0.11",

    # --- messy data: PDFs, tables, images ---
    "pymupdf>=1.24.13",
    "pdfplumber>=0.11.4",
    "rapidocr-onnxruntime>=1.3.24",
    "pillow>=11.0.0",

    # --- analysis ---
    "pandas>=2.2.3",
    "numpy>=1.26.4,<2.1",
    "scipy>=1.14.1",
    "statsmodels>=0.14.4",
    "scikit-learn>=1.5.2",

    # --- visualisation ---
    "plotly>=5.24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
]

[project.scripts]
research-agent = "backend.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # UP042 wants enum.StrEnum over (str, Enum). Pydantic's own documentation
    # uses (str, Enum), it serialises identically, and StrEnum changes what
    # str(member) returns -- which would quietly alter every f-string that
    # interpolates an enum. Not worth the churn for a stylistic preference.
    "UP042",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: tests that spend real wall-clock time (sandbox timeouts, OCR)",
    "network: tests that require live internet access",
]
